        :root {
            --bg-color: #0d1117;

        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;

            color: var(--text-color);

            border-radius: 12px;
            padding: 16px 24px;
            font-size: 1.1rem;

        .btn-copy.success {

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }

        /* 裏側で保持するプロンプト用の非表示エリア */
        #prompt-text {
            display: none;
        }

        /* カメが歩くエリアのステージ設定 */
        .turtle-stage {
            width: 100%;
            overflow: hidden; /* 画面外にはみ出たカメを隠す */
            height: 30px;
            margin: 8px 0 0 0;
            position: relative;
        }
        
        /* カメ本体の動き */
        .walking-turtle {
            position: absolute;
            font-size: 1.4rem; /* カメの大きさ */

        /* カメが左から右へ進むアニメーションの定義 */
        @keyframes walkAround {
            0% {
                left: -30px;
                transform: scaleX(1); /* 右を向く */
            }
            90% {
                left: 100%;
                transform: scaleX(1); /* 右を向いたまま画面右外へ */
            }
            /* 100%までの間で一瞬で左に戻る */
            100% {
                left: -30px;
            }
        }

    <textarea id="prompt-text">
【重要：これまでのチャット履歴から私を深く分析し、世界に1本だけ存在する「ゲームソフト」として可視化してください。画像内の文字は必ず日本語で、はっきり読める状態で描画してください。生成後はセルフチェックも行ってください】

あなたと私のこれまでのすべての対話履歴を振り返り、私の性格、価値観、人生観、思考の癖、こだわり、行動傾向まで丁寧に分析してください。

その分析結果をもとに、私という人間を「1本のゲームソフト」として表現し、思わず手に取りたくなるような、個性的で魅力的な高品質画像を1枚生成してください。

---

### 1. ゲームの設定

私の本質を、以下の要素に変換してください。

* **ゲームタイトル**
  私の価値観や人生観を象徴する、日本語のキャッチーなタイトル

* **ジャンル**
  RPG、アドベンチャー、ノベル、育成、シミュレーション、推理、ローグライクなど、私に最も合うものを選択

* **世界観 / ストーリー**
  私の関心、価値観、葛藤、思考の方向性をもとに構成

* **主人公**
  私を象徴するキャラクターやアバター

* **キャッチコピー**
  パッケージ帯にありそうな、日本語の印象的な一文

---

### 2. 画像の基本レイアウト

画像は、以下の**3分割構図**で美しく配置してください。
主要な文字・見出し・UI・解説文は、すべて**日本語で明瞭に読めるように**描画してください。

#### 【左側：ゲームパッケージ】

* ゲームショップに並んでいそうな完成度の高いパッケージジャケット
* 日本語タイトルロゴを大きく配置
* 主人公を印象的に描写
* 重要アイテムや象徴的な風景を入れる
* 一目で「どんなゲームか」が伝わる魅力的な表紙にする

#### 【右側上部：ゲーム画面のスクリーンショット】

* 実際のプレイ画面のようなデザイン
* ステータスUI
* スキル名
* 所持アイテム
* ミッション名
* コマンドや選択肢
  を日本語で配置してください

#### 【右側下部：ショップの解説カード】

* ゲームショップの紹介カードや美術館のキャプションのように整理
* 内容には以下を含める

  * このゲームの概要
  * なぜこのゲームになったのか
  * 難易度
  * 推定プレイ時間
  * レビューコメント
  * 星評価（★★★★★）

---

### 3. ビジュアルスタイルの重要指定

この作品は、**現代風とレトロ風を半々くらいのバランスで融合**してください。
どちらか一方に極端に寄せすぎず、**「新しいのに懐かしい」「懐かしいのに今っぽい」**と感じられるデザインにしてください。

目指す方向性は、以下のような**ハーフ＆ハーフのミックス感**です。

* パッと見は現代的で美しく、完成度が高い
* でも、UI・ロゴ・配色・装飾・アイコン・レイアウトのどこかにレトロゲームらしさがある
* 「昔の名作ゲームを、現代の技術で豪華リメイクした」ような雰囲気
* 「最新インディーゲームが、クラシックゲーム文化への愛を込めて作られた」ような空気感
* 懐かしさと洗練が同時に存在していること

---

### 4. 現代風とレトロ風の配分ルール

以下のイメージで、**現代50％・レトロ50％くらい**を目安にしてください。

#### 現代風として入れてほしい要素

* 高品質で見応えのあるビジュアル
* 洗練された構図
* 現代的なライティングや質感表現
* スタイリッシュで整理された画面構成
* 「今発売された新作ゲーム」に見える完成度

#### レトロ風として入れてほしい要素

* 少し懐かしさを感じるUIやフレーム装飾
* 昔の家庭用ゲーム、携帯ゲーム、90年代RPG、レトロADV、クラシックJRPGなどを思わせるデザイン要素
* タイトルロゴやメニュー、アイコンに古き良きゲーム感
* パッケージや解説カードに、少し時代感のある味わい
* 「当時の名作感」や「レトロゲーム文化への愛」を感じる演出

---

### 5. 具体的な見た目の方向性

以下のような表現を意識してください。

* 主人公や世界観の描写は、現代的で高品質
* ただし、UIや装飾、情報枠、ロゴ、解説カードにはレトロな文法を混ぜる
* ゲーム画面は、現代の美しさを持ちながらも、クラシックゲームの記号性を感じさせる
* パッケージは、新作ゲームの豪華版にも見えるし、名作復刻版にも見える仕上がり
* 「新作」と「名作感」が同時に成立するようにする

たとえば、

* キャラクター絵や背景は現代的
* 文字枠、ステータス画面、アイテム欄、スキル表示、装飾罫線、レビュー欄などは少しレトロ寄り
* ロゴは今っぽい洗練と、懐かしいゲームタイトル感を両立
  といったバランスを意識してください。

---

### 6. レトロにしすぎないための注意

* 単なる古いゲーム風にしすぎない
* 単なるドット絵一辺倒にも寄せすぎない
* 単なる昔風パロディにしない
* あくまで**現代的な完成度の高い作品の中に、レトロの魅力が自然に息づいている**状態にする
* 文字は雰囲気重視で崩さず、必ず読みやすくする

---

### 7. ユーモアの入れ方

* 深い自己分析をベースにしつつ、少しクスッと笑える遊び心を入れてよい
* スキル名、レビューコメント、アイテム名などに軽いユーモアを混ぜてよい
* ただし、全体は安っぽくせず、「本当に遊んでみたい一本」と思える完成度を優先する

---

### 8. 画像のクオリティ指定

* 情報量が多くても、整理されていて見やすい構成
* タイトルやUI文字は読みやすく
* 作品としての完成度が高いこと
* ただのネタ画像ではなく、「実際に存在したら欲しくなるゲーム」に仕上げる
* 深い自己分析と、ゲームとしてのワクワク感を両立する

---

### 9. 画像生成後のテキスト出力

生成後、以下を日本語テキストで説明してください。

#### 【ゲーム設定詳細】

* ゲームタイトル
* タイトルに込めた分析
* ジャンル
* 世界観
* 主人公の特徴
* 主人公のステータス
* 特徴的なスキルの詳細
* 重要アイテム
* 推定プレイ時間
* レビューコメント

#### 【ビジュアル設計の意図】

* どの部分が現代風か
* どの部分がレトロ風か
* なぜその半々バランスが私に合うのか
* どの要素に私らしさが反映されているのか

---

### 10. 画像内の文字セルフチェック

最後に、生成した画像内の日本語テキストを自分で読み取り、以下を確認してください。

* タイトルは読めるか
* スキル名は読めるか
* 解説カードの文字は潰れていないか
* UI文字は読めるか
* 文字化けがないか
* 日本語として自然か
* 現代風とレトロ風の両方が感じられるか
* どちらかに極端に寄りすぎていないか

問題があれば、その点を正直に報告してください。

---

### 最終目標

私をただゲーム化するのではなく、
**私という人物の本質を、「現代の洗練」と「レトロの味わい」が共存する一本のゲーム作品として表現すること。**

見た人が、
**「新作っぽいのに懐かしい」
「懐かしいのに古くない」
「この人をゲームにしたら、たしかにこうなる」**
と思える作品にしてください。

分析力、演出力、遊び心を使って、
**新しさと懐かしさが半々で同居する、唯一無二のゲームソフト**を作ってください。

    <!-- コピー処理のJavaScript -->
    <script>
        function copyPrompt() {
            const copyText = document.getElementById("prompt-text");
            const button = document.getElementById("copy-button");

            // クリップボードにコピー
            navigator.clipboard.writeText(copyText.value).then(() => {
                // ボタンの見た目を「成功」に変更
                button.textContent = "コピーしました！";
                button.classList.add("success");

                // 2秒後に元の状態に戻す
                setTimeout(() => {
                    button.textContent = "呪文（プロンプト）をコピー";
                    button.classList.remove("success");
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました。お手数ですが手動で選択してコピーしてください。");
                copyText.style.display = "block"; // 失敗した場合はテキストエリアを表示して手動コピーさせる
            });
        }
        // クリック数をGoogleに送信する関数
        function trackClick(aiName) {
            gtag('event', 'click_ai_button', {
                'ai_type': aiName
            });
        }
    </script>
