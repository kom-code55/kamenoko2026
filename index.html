    <style>
        :root {
            --bg-color: #0d1117;

            color: var(--text-bright);

            margin: 0 0 8px 0;
            letter-spacing: -0.02em;

        .card {
            background-color: var(--card-bg);

            border-radius: 16px;

            margin-bottom: 24px;

        .step-num {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

            color: var(--text-bright);
            font-size: 1.1rem;
            margin: 0 0 16px 0;
        }

        .btn-copy {
            background: linear-gradient(135deg, #ff6a00, #ff4500);
            color: var(--text-bright);

            border-radius: 12px;
            padding: 16px 24px;
            font-size: 1.1rem;

            flex-direction: column;

            margin-top: 12px;

            display: block;

    <!-- コピーされるプロンプトの本体（隠しテキスト） -->
    <textarea id="prompt-text">
【重要：これまでのチャット履歴から私をディープに分析し、世界に1本だけ存在する「伝説のゲームソフト」として可視化してください。画像内の文字は必ず日本語で、読める文字として描画してください。生成後は、開発チームの最終デバッグのようにセルフチェックも行ってください】

あなたと私のこれまでのすべての対話履歴を振り返り、私の性格、価値観、人生観、思考の癖、こだわり、なぜか毎回出てしまう行動パターンまで、できるだけ精度高く分析してください。

その分析結果をもとに、私という人間を「1本の新作ゲームソフト」として表現し、ゲームショップで見かけた瞬間に「これは予約特典ついてますか？」と言いたくなるような、個性的でワクワクする高品質な画像を1枚生成してください。

---

## 1. ゲームの設定

私の本質を、以下の要素に変換してください。

* **ゲームタイトル**
  私の価値観や人生観を象徴する、日本語のキャッチーなタイトル。
  ただし、適当にカッコよくするのではなく、「あ、これは確かに私っぽい」と思える深みを持たせてください。

* **ジャンル**
  RPG、アドベンチャー、シミュレーション、ローグライク、育成ゲーム、推理ゲームなど、私の思考や生き方に合ったジャンルを選んでください。
  必要なら「戦略型ツッコミ人生RPG」のような謎ジャンルを発明しても構いません。

* **世界観 / ストーリー**
  私の関心、価値観、葛藤、目指している方向性をベースに、ゲームの舞台や物語を作ってください。
  ちょっと壮大でも、ちょっと笑えても、妙に納得感がある設定にしてください。

* **主人公**
  私を象徴するキャラクターやアバターを設計してください。
  見た目、雰囲気、装備、持ち物、表情、立ち姿などに、私らしさを反映してください。

* **キャッチコピー**
  ゲームパッケージの帯に書かれていそうな、日本語の印象的な一文を作ってください。
  例：「世界を救う前に、まずタスクを整理しろ。」のように、少しユーモアがあってもOKです。

---

## 2. 画像のレイアウト・デザイン指定

画像は、構図が迷子にならないように、以下の**3分割レイアウト**で美しく配置してください。
画像内の主要な文字、タイトル、見出し、UI、カード説明は、すべて**日本語でハッキリ読めるように**描き込んでください。

### 【左側：ゲームパッケージ】

実際にゲームショップの新作棚に並んでいそうな、完成度の高いパッケージジャケットを描いてください。

* 日本語タイトルロゴを大きく配置
* 主人公を印象的に描写
* 私を象徴する重要アイテムや風景を配置
* 映画ポスターのようなドラマチックな構図
* 「買う予定なかったのに、気づいたらレジに持って行っていた」くらいの魅力を出してください

### 【右側上部：ゲーム画面のスクリーンショット】

実際のプレイ画面をハメ込んだようなデザインにしてください。

* ステータスUI
* 特徴的なスキル名
* 獲得アイテム
* ミッション名
* 選択肢やコマンド表示

すべて日本語で、スタイリッシュなゲームUIとして配置してください。
スキル名は、私の性格や思考パターンを反映しつつ、少し笑える名前にしてください。
例：「深読みLv.99」「締切前覚醒」「空気読み過ぎバリア」など。

### 【右側下部：ショップの解説カード】

ゲームショップや美術館のキャプションのような、美しい解説カードを配置してください。

カード内には以下を含めてください。

* なぜこのゲームになったのかの短い解説
* ジャンル
* 難易度
* 推定プレイ時間
* おすすめプレイヤータイプ
* レビューコメント
* 星評価：★★★★★

レビューコメントは、真面目すぎず、少しクスッと笑える内容にしてください。
例：「気づいたら自分の人生攻略法まで考え始めていました。★★★★★」

---

## 3. 画像のクオリティ指定

以下の雰囲気で、高品質に仕上げてください。

* 現代的で高級感のある3Dデジタルアート
* シネマティックなコンセプトアート
* ゲーム広告ビジュアルのような完成度
* 光の演出、奥行き、質感を丁寧に
* 情報量は多いが、ゴチャつかず読みやすい構成
* 「架空のゲームなのに、なぜか攻略Wikiが存在しそう」なリアリティ

---

## 4. 画像生成後のテキスト出力

画像を生成した後、画像だけでは伝わりきらない設定を、日本語テキストで説明してください。

以下を必ず含めてください。

### 【ゲーム設定詳細】

* ゲームタイトル
* そのタイトルに込めた私の分析結果
* ジャンルと世界観
* 主人公の特徴
* 主人公のステータス
* 特徴的なスキルの詳細
* 重要アイテム
* 推定プレイ時間
* クスッと笑えるレビューコメント

### 【自己分析の反映ポイント】

このゲームのどの部分に、私の性格、価値観、思考の癖、人生観が反映されているのかを説明してください。
ただし、褒めすぎて謎の神話にしないでください。良いところも、ちょっと面倒くさいところも、愛をもって正直に表現してください。

---

## 5. 画像内の文字セルフチェック

最後に、あなた自身のビジョン機能を使って、今生成した画像内の日本語テキストを読み取ってください。

以下を確認してください。

* タイトルは読めるか
* スキル名は読めるか
* 解説カードの文字は潰れていないか
* 変な文字化けや謎漢字が混ざっていないか
* 日本語として自然か
* 人間の目で見て、ゲーム画面として成立しているか

確認結果を、最後に日本語で報告してください。

もし文字が読みにくい、崩れている、文字化けしている、構図が破綻しているなどの問題がある場合は、正直に報告し、どこを改善すべきかも説明してください。

---

## 最終的な目標

私をただ「ゲームっぽくする」のではなく、
**私という人間を、ちょっと笑えて、ちゃんと深くて、思わず遊んでみたくなる一本のゲーム作品として表現すること。**

真面目な分析力と、ゲームクリエイターの妄想力と、深夜テンションのユーモアを全部使って、最高の一本にしてください。

    <!-- コピー処理のJavaScript -->
    <script>
        function copyPrompt() {
            const copyText = document.getElementById("prompt-text");
            const button = document.getElementById("copy-button");

            // クリップボードにコピー
            navigator.clipboard.writeText(copyText.value).then(() => {
                // ボタンの見た目を「成功」に変更
                button.textContent = "コピーしました！";
                button.classList.add("success");

                // 2秒後に元の状態に戻す
                setTimeout(() => {
                    button.textContent = "呪文（プロンプト）をコピー";
                    button.classList.remove("success");
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました。お手数ですが手動で選択してコピーしてください。");
                copyText.style.display = "block"; // 失敗した場合はテキストエリアを表示して手動コピーさせる
            });
        }
        // クリック数をGoogleに送信する関数
        function trackClick(aiName) {
            gtag('event', 'click_ai_button', {
                'ai_type': aiName
            });
        }
    </script>
